<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hallucination Hunter - Demo</title>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .bg-card { background-color: #161b22; }
        .border-subtle { border-color: #30363d; }
        .shadow-glow { box-shadow: 0 0 15px rgba(56, 189, 248, 0.1); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .highlight-unsupported { background-color: rgba(234, 179, 8, 0.2); border-bottom: 2px solid #eab308; }
        .highlight-contradiction { background-color: rgba(239, 68, 68, 0.2); border-bottom: 2px solid #ef4444; }
        .highlight-entailed { background-color: rgba(34, 197, 94, 0.2); border-bottom: 2px solid #22c55e; }
    </style>
</head>
<body class="min-h-screen selection:bg-sky-500 selection:text-white pb-20">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, Component } = React;

        const API_URL = 'http://localhost:8001';

        const EXAMPLES = {
            faithful: {
                source: "The Apollo 11 mission was the spaceflight that first landed humans on the Moon. Commander Neil Armstrong and lunar module pilot Buzz Aldrin formed the American crew that landed the Apollo Lunar Module Eagle on July 20, 1969.",
                response: "Neil Armstrong and Buzz Aldrin were the first humans to land on the Moon during the Apollo 11 mission in July 1969."
            },
            hallucinated: {
                source: "The Eiffel Tower is a wrought-iron lattice tower on the Champ de Mars in Paris, France. It was constructed from 1887 to 1889 as the centerpiece of the 1889 World's Fair.",
                response: "The Eiffel Tower is located in Paris. It was completely made of solid gold and was originally built in 2015 for the Olympic Games."
            }
        };

        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, errorInfo: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true };
            }
            componentDidCatch(error, errorInfo) {
                console.error("ErrorBoundary caught an error:", error, errorInfo);
                this.setState({ errorInfo });
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="max-w-4xl mx-auto mt-20 p-8 border border-red-500/30 bg-red-500/10 rounded-xl text-center">
                            <h2 className="text-2xl font-bold text-red-500 mb-4">React App Crashed 💥</h2>
                            <p className="text-red-400 mb-6">An unexpected rendering error occurred.</p>
                            <button 
                                onClick={() => window.location.reload()}
                                className="px-6 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors"
                            >
                                Reload App
                            </button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const Badge = ({ children, color }) => {
            const colors = {
                green: "bg-green-500/10 text-green-400 border-green-500/20",
                red: "bg-red-500/10 text-red-400 border-red-500/20",
                yellow: "bg-yellow-500/10 text-yellow-400 border-yellow-500/20",
            };
            return (
                <span className={`px-2.5 py-0.5 rounded border text-xs font-semibold ${colors[color] || ''}`}>
                    {children}
                </span>
            );
        };

        const HighlightedResponse = ({ response, claims }) => {
            if (!response) return <div className="p-4 bg-[#0d1117] rounded-lg border border-subtle">No response provided.</div>;
            if (!claims || !Array.isArray(claims)) return <div className="p-4 bg-[#0d1117] rounded-lg border border-subtle">{response}</div>;

            let highlighted = response;
            
            claims.forEach(claim => {
                if (!claim?.text) return;
                let cls;
                // Using final_label for highlighting
                const safeLabel = claim.final_label || "UNSUPPORTED";
                if (safeLabel === 'CONTRADICTION') cls = 'highlight-contradiction';
                else if (safeLabel === 'UNSUPPORTED') cls = 'highlight-unsupported';
                else cls = 'highlight-entailed';

                const regexStr = claim.text.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                try {
                    const regex = new RegExp(`(${regexStr})`, 'g');
                    highlighted = highlighted.replace(regex, `<span class="px-1 rounded ${cls}">$1</span>`);
                } catch(e) {
                    console.error("Regex highlight error:", e);
                }
            });

            return (
                <div 
                    className="p-4 bg-[#0d1117] rounded-lg border border-subtle leading-relaxed text-sm"
                    dangerouslySetInnerHTML={{ __html: highlighted }}
                />
            );
        };

        const ResultSection = ({ result, response }) => {
            if (!result) return <div className="p-8 text-center text-gray-500">No data available</div>;

            // FIX: Using result.verdict and result.summary directly
            const verdict = result?.verdict || "HALLUCINATED";
            const isFaithful = verdict === 'FAITHFUL';
            const confidence = typeof result?.confidence === 'number' ? result.confidence : 0.5;
            const summary = result?.summary;
            const avgSim = result?.metrics?.avg_similarity || 0;
            const claimsList = Array.isArray(result?.claims) ? result.claims : [];
            const matrix = Array.isArray(result?.alignment_matrix) ? result.alignment_matrix : [];

            return (
                <div className="space-y-6 animate-[fadeIn_0.5s_ease-out]">
                    <div className="flex items-center justify-center gap-4 text-sm font-medium text-gray-500 uppercase tracking-widest mb-8">
                        <span>Input</span>
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>
                        <span>Analysis</span>
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>
                        <span className="text-sky-400">Result</span>
                    </div>

                    {/* Main Verdict Panel */}
                    <div className={`p-8 rounded-2xl border-2 flex flex-col md:flex-row items-center justify-between ${isFaithful ? 'bg-green-500/5 border-green-500/20' : 'bg-red-500/5 border-red-500/20'}`}>
                        <div className="flex items-center gap-6 mb-4 md:mb-0">
                            <div className={`w-16 h-16 rounded-full flex items-center justify-center text-3xl ${isFaithful ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}`}>
                                {isFaithful ? '✓' : '✗'}
                            </div>
                            <div>
                                <div className="text-sm font-bold text-gray-400 uppercase tracking-wider mb-1">Final Verdict</div>
                                <h2 className={`text-3xl font-black tracking-tight ${isFaithful ? 'text-green-400' : 'text-red-400'}`}>
                                    {verdict}
                                </h2>
                                <div className="text-gray-400 text-sm mt-1 max-w-sm font-medium">
                                    {summary}
                                </div>
                            </div>
                        </div>
                        <div className="text-right">
                            <div className="text-2xl font-bold text-white mb-2">{(confidence * 100).toFixed(1)}% Confidence</div>
                            <div className="w-48 h-3 bg-gray-800 rounded-full overflow-hidden">
                                <div 
                                    className={`h-full rounded-full transition-all duration-1000 ${isFaithful ? 'bg-green-500' : 'bg-red-500'}`}
                                    style={{ width: `${confidence * 100}%` }}
                                />
                            </div>
                            <div className="mt-2 text-xs text-gray-500">
                                Alignment Score: {avgSim.toFixed(2)}
                            </div>
                        </div>
                    </div>

                    <div className="grid md:grid-cols-2 gap-6">
                        {/* Visual Explanation (Response) */}
                        <div className="bg-card border border-subtle rounded-xl p-6 shadow-lg">
                            <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
                                <svg className="w-5 h-5 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                                Visual Explanation
                            </h3>
                            <HighlightedResponse response={response} claims={claimsList} />
                            <div className="mt-4 flex gap-4 text-xs font-medium border-t border-subtle pt-4">
                                <div className="flex items-center gap-2"><div className="w-3 h-3 bg-green-400 rounded-sm"></div> Entailed</div>
                                <div className="flex items-center gap-2"><div className="w-3 h-3 bg-red-400 rounded-sm"></div> Contradiction</div>
                                <div className="flex items-center gap-2"><div className="w-3 h-3 bg-yellow-400 rounded-sm"></div> Unsupported</div>
                            </div>
                        </div>

                        {/* Claim Breakdown */}
                        <div className="bg-card border border-subtle rounded-xl p-6 shadow-lg">
                            <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
                                <svg className="w-5 h-5 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" /></svg>
                                Claim Breakdown
                            </h3>
                            <div className="space-y-3 max-h-[300px] overflow-y-auto pr-2 scrollbar-hide">
                                {claimsList.map((claim, idx) => {
                                    // FIX: Using claim.final_label and claim.similarity
                                    const finalLabel = claim?.final_label || "UNSUPPORTED";
                                    const isEnt = finalLabel === 'ENTAILED';
                                    const isCon = finalLabel === 'CONTRADICTION';
                                    const color = isEnt ? 'green' : (isCon ? 'red' : 'yellow');
                                    const sim = typeof claim?.similarity === 'number' ? claim.similarity : 0.3;
                                    
                                    return (
                                        <div key={idx} className={`p-4 rounded-lg border bg-[#0d1117] ${isEnt ? 'border-green-500/20' : (isCon ? 'border-red-500/30 bg-red-500/5' : 'border-yellow-500/30 bg-yellow-500/5')}`}>
                                            <div className="flex items-center justify-between mb-2">
                                                <Badge color={color}>{finalLabel}</Badge>
                                                <span className="text-xs text-gray-500 font-mono">Sim: {sim.toFixed(2)}</span>
                                            </div>
                                            <p className="text-sm text-gray-300 leading-relaxed">{claim?.text || "Missing text"}</p>
                                        </div>
                                    );
                                })}
                                {claimsList.length === 0 && (
                                    <div className="text-center text-sm text-gray-500 py-8">No specific claims extracted.</div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Alignment Matrix Section */}
                    {matrix.length > 0 && (
                        <div className="bg-card border border-subtle rounded-xl p-6 shadow-lg">
                            <h3 className="text-lg font-bold text-white mb-2 flex items-center gap-2">
                                <svg className="w-5 h-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 10h16M4 14h16M4 18h16" /></svg>
                                Semantic Alignment Matrix
                            </h3>
                            <p className="text-sm text-gray-400 mb-6 font-medium">Each row shows how a claim aligns with the original source sentences.</p>
                            
                            <div className="overflow-x-auto pb-4">
                                <table className="w-full text-left border-collapse text-xs">
                                    <thead>
                                        <tr>
                                            <th className="p-3 text-gray-500 font-medium whitespace-nowrap sticky left-0 bg-card z-10">Claim Extract / Source →</th>
                                            {(matrix[0] || []).map((_, j) => (
                                                <th key={j} className="p-3 text-gray-400 border-b border-subtle min-w-[80px] text-center">S {j+1}</th>
                                            ))}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {matrix.map((row, i) => (
                                            <tr key={i} className="hover:bg-white/5 transition-colors group">
                                                <td className="p-3 border-b border-subtle text-gray-300 max-w-[250px] truncate sticky left-0 bg-card group-hover:bg-[#1c2128]">
                                                    {claimsList[i]?.text || `Claim ${i+1}`}
                                                </td>
                                                {Array.isArray(row) && row.map((val, j) => {
                                                    const cleanVal = typeof val === 'number' ? val : 0;
                                                    const r = Math.round(255 * (1 - cleanVal) * 0.9);
                                                    const g = Math.round(80 + 175 * cleanVal);
                                                    const b = Math.round(120 + 135 * (1 - cleanVal));
                                                    return (
                                                        <td key={j} className="p-2 border-b border-subtle text-center">
                                                            <div 
                                                                className="w-full rounded py-1 font-mono hover:scale-110 transition-transform cursor-default"
                                                                style={{ backgroundColor: `rgba(${r}, ${g}, ${b}, ${0.15 + cleanVal * 0.35})`, color: '#bfc9d4' }}
                                                            >
                                                                {cleanVal.toFixed(2)}
                                                            </div>
                                                        </td>
                                                    );
                                                })}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        function App() {
            const [source, setSource] = useState("");
            const [response, setResponse] = useState("");
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);

            useEffect(() => {
                loadExample('hallucinated');
            }, []);

            const loadExample = (type) => {
                if(EXAMPLES[type]) {
                    setSource(EXAMPLES[type].source);
                    setResponse(EXAMPLES[type].response);
                    setResult(null);
                    setError(null);
                }
            };

            const handleAnalyze = async () => {
                if (!source || !response) {
                    setError("Please provide both source and response texts.");
                    return;
                }
                
                try {
                    setLoading(true);
                    setError(null);
                    setResult(null);

                    const res = await fetch(`${API_URL}/detect`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ source, response })
                    });
                    
                    if (!res.ok) {
                        throw new Error(`API failed with status ${res.status}`);
                    }
                    
                    const data = await res.json();
                    
                    // MANDATORY DEBUG LOG
                    console.log("API RESPONSE:", data);
                    
                    setResult(data);
                } catch (err) {
                    console.error("Analysis Error:", err);
                    setError(err.message || "Something went wrong while connecting to the API.");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-6xl mx-auto px-6 py-12">
                    {/* Header */}
                    <div className="mb-10 text-center">
                        <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-sky-500 shadow-glow mb-4">
                            <svg className="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </div>
                        <h1 className="text-4xl font-extrabold tracking-tight text-white mb-2">Hallucination Hunter</h1>
                        <p className="text-gray-400 text-lg">Strict Fact Verifier & AI Safety Agent</p>
                    </div>

                    {/* Inputs */}
                    <div className="bg-card border border-subtle rounded-xl p-6 shadow-xl mb-8">
                        <div className="grid md:grid-cols-2 gap-6 mb-6">
                            <div>
                                <label className="flex items-center text-sm font-semibold text-gray-300 mb-2 uppercase tracking-wider">
                                    Source Passage <span className="ml-2 px-2 py-0.5 bg-blue-500/10 text-blue-400 rounded text-[10px]">Reference</span>
                                </label>
                                <textarea 
                                    className="w-full h-40 bg-[#0d1117] border border-subtle rounded-lg p-4 text-sm focus:ring-2 focus:ring-sky-500 focus:border-sky-500 outline-none transition-all placeholder-gray-600"
                                    value={source}
                                    onChange={(e) => setSource(e.target.value)}
                                    placeholder="Enter verified grounding knowledge here..."
                                />
                            </div>
                            <div>
                                <label className="flex items-center text-sm font-semibold text-gray-300 mb-2 uppercase tracking-wider">
                                    AI Response <span className="ml-2 px-2 py-0.5 bg-purple-500/10 text-purple-400 rounded text-[10px]">To Verify</span>
                                </label>
                                <textarea 
                                    className="w-full h-40 bg-[#0d1117] border border-subtle rounded-lg p-4 text-sm focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition-all placeholder-gray-600"
                                    value={response}
                                    onChange={(e) => setResponse(e.target.value)}
                                    placeholder="Enter the AI generation to check for hallucinations..."
                                />
                            </div>
                        </div>

                        <div className="flex flex-wrap items-center justify-between gap-4 border-t border-subtle pt-6">
                            <div className="flex gap-3">
                                <button onClick={() => loadExample('faithful')} className="px-4 py-2 text-sm font-medium text-gray-400 bg-transparent border border-subtle rounded-lg hover:text-white hover:border-gray-500 transition-colors">
                                    Load Faithful Example
                                </button>
                                <button onClick={() => loadExample('hallucinated')} className="px-4 py-2 text-sm font-medium text-gray-400 bg-transparent border border-subtle rounded-lg hover:text-white hover:border-gray-500 transition-colors">
                                    Load Hallucinated Example
                                </button>
                            </div>
                            <button 
                                onClick={handleAnalyze}
                                disabled={loading}
                                className={`px-8 py-3 font-semibold rounded-lg transition-all flex items-center justify-center min-w-[220px] ${loading ? 'bg-gray-700 text-gray-400 cursor-not-allowed' : 'bg-white text-black hover:bg-gray-200 focus:ring-4 focus:ring-white/20'}`}
                            >
                                {loading ? (
                                    <>
                                        <svg className="animate-spin h-5 w-5 mr-3 text-gray-400" viewBox="0 0 24 24">
                                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle>
                                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                        </svg>
                                        Analyzing...
                                    </>
                                ) : "Detect Hallucinations"}
                            </button>
                        </div>
                        
                        {error && (
                            <div className="mt-6 p-4 bg-red-500/10 border border-red-500/20 text-red-400 rounded-lg text-sm font-medium">
                                ⚠ {error}
                            </div>
                        )}
                    </div>

                    {/* Loading State Skeleton UI */}
                    {loading && (
                        <div className="text-center p-12 text-gray-500 animate-pulse border border-subtle rounded-xl bg-card">
                            <svg className="mx-auto h-12 w-12 mb-4 text-sky-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M13 10V3L4 14h7v7l9-11h-7z" />
                            </svg>
                            <p className="text-lg font-medium">Running deep NLI analysis...</p>
                        </div>
                    )}

                    {!loading && result && (
                        <ResultSection result={result} response={response} />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
