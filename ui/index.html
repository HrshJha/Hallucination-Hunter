<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hallucination Hunter</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<h1 style="color:red;">UI FILE</h1>
<style>
  
body {
  background:#020617;
  color:#e5e7eb;
  font-family:sans-serif;
}
.card {
  background:#0f172a;
  padding:16px;
  border-radius:10px;
  border:1px solid #1f2937;
}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const API_URL = "http://localhost:8001";

function App() {
  const [source,setSource]=React.useState("");
  const [response,setResponse]=React.useState("");
  const [result,setResult]=React.useState(null);

  const analyze = async () => {
    const res = await fetch(API_URL+"/detect",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({source,response})
    });

    const data = await res.json();
    setResult(data);
  };

  const verdict = result?.label || "HALLUCINATED";
  const confidence = result?.confidence ?? 0.5;
  const claims = result?.claims || [];
  const matrix = result?.alignment_matrix || [];

  const verdictColor =
    verdict === "FAITHFUL" ? "bg-green-900 border-green-500"
    : "bg-red-900 border-red-500";

  return (
    <div className="max-w-4xl mx-auto p-6">

      <h1 className="text-3xl font-bold mb-6">Hallucination Hunter</h1>

      <textarea
        placeholder="Source Passage"
        className="w-full p-3 mb-3 rounded bg-gray-800"
        value={source}
        onChange={e=>setSource(e.target.value)}
      />

      <textarea
        placeholder="AI Response"
        className="w-full p-3 mb-3 rounded bg-gray-800"
        value={response}
        onChange={e=>setResponse(e.target.value)}
      />

      <button
        onClick={analyze}
        className="bg-blue-600 px-5 py-2 rounded mb-6"
      >
        Detect Hallucinations
      </button>

      {result && (
        <div className="space-y-6">

          {/* 🔥 VERDICT */}
          <div className={`card border ${verdictColor}`}>
            <h2 className="text-xl font-bold">{verdict}</h2>
            <p>Confidence: {(confidence*100).toFixed(1)}%</p>
          </div>

          {/* 🔥 CLAIMS */}
          <div className="card">
            <h3 className="font-semibold mb-3">Claim Breakdown</h3>

            {claims.map((c,i)=>{
              const label = c.label?.toUpperCase();

              const color =
                label === "ENTAILMENT" ? "text-green-400"
                : label === "CONTRADICTION" ? "text-red-400"
                : "text-yellow-400";

              return (
                <div key={i} className="mb-3">
                  <div className="flex justify-between text-sm">
                    <span className={color}>{label}</span>
                    <span>{c.score?.toFixed(2)}</span>
                  </div>
                  <p className="text-gray-300">{c.text}</p>
                </div>
              );
            })}
          </div>

          {/* 🔥 INTERACTIVE HEATMAP */}
          <div className="card">
            <h3 className="font-semibold mb-4">Alignment Heatmap</h3>

            {matrix.map((row,i)=>(
              <div key={i} className="flex gap-1 mb-1">

                <div className="w-40 text-xs text-gray-400 truncate">
                  {claims[i]?.text}
                </div>

                {row.map((val,j)=>{
                  const v = val || 0;

                  const bg = `hsl(${(1 - v) * 240}, 90%, ${30 + v * 40}%)`;

                  return (
                    <div
                      key={j}
                      className="w-12 h-10 flex items-center justify-center text-xs font-mono rounded hover:scale-110 transition"
                      style={{backgroundColor:bg}}
                      title={`Similarity: ${v.toFixed(2)}`}
                    >
                      {v.toFixed(2)}
                    </div>
                  );
                })}
              </div>
            ))}
          </div>

        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
