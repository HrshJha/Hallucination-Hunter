<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hallucination Hunter</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#0d1117; color:#c9d1d9; font-family:sans-serif; }
.box { background:#161b22; padding:12px; margin-top:10px; border-radius:6px; }
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const API_URL = "http://localhost:8001";

function App() {
  const [source,setSource]=React.useState("");
  const [response,setResponse]=React.useState("");
  const [result,setResult]=React.useState(null);

  const analyze = async () => {
    const res = await fetch(API_URL+"/detect",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({source,response})
    });

    const data = await res.json();
    console.log("FULL API RESPONSE:", data);
    setResult(data);
  };

  const verdict = result?.verdict || "HALLUCINATED";
  const confidence = result?.confidence ?? 0.5;

  const avgSim =
    result?.avg_similarity ??
    result?.metrics_out?.avg_similarity ??
    result?.metrics?.avg_similarity ??
    0.3;

  const claims = result?.claims || [];

  return (
    <div style={{maxWidth:"800px", margin:"auto", padding:"20px"}}>

      <h1 style={{fontSize:"28px", marginBottom:"20px"}}>Hallucination Hunter</h1>

      <textarea
        placeholder="Source"
        style={{width:"100%", height:"80px", marginBottom:"10px"}}
        value={source}
        onChange={e=>setSource(e.target.value)}
      />

      <textarea
        placeholder="Response"
        style={{width:"100%", height:"80px", marginBottom:"10px"}}
        value={response}
        onChange={e=>setResponse(e.target.value)}
      />

      <button onClick={analyze} style={{padding:"10px 20px", marginBottom:"20px"}}>
        Detect
      </button>

      {result && (
        <div>

          <div className="box">
            <h2>{verdict}</h2>
            <p>Confidence: {(confidence*100).toFixed(1)}%</p>
            <p>Avg Similarity: {avgSim.toFixed(2)}</p>
          </div>

          {claims.map((c,i)=>{
            const label = c?.final_label || "UNSUPPORTED";
            const sim = c?.similarity ?? 0.3;

            return (
              <div key={i} className="box">
                <div style={{display:"flex", justifyContent:"space-between"}}>
                  <span>{label}</span>
                  <span>{sim.toFixed(2)}</span>
                </div>
                <p>{c.text}</p>
              </div>
            );
          })}

        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
